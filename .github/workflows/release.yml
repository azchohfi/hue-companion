name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  test:
    name: Run Tests
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build solution
      run: dotnet build --no-restore --configuration Release

    - name: Run unit tests
      run: |
        dotnet test src/HueWindows.Tests `
          --no-build `
          --configuration Release `
          --verbosity normal `
          --logger "trx;LogFileName=test-results.trx"

  build:
    name: Build ${{ matrix.platform }}
    runs-on: windows-latest
    needs: test

    strategy:
      matrix:
        platform: [x64, ARM64]
        include:
          - platform: x64
            rid: win-x64
          - platform: ARM64
            rid: win-arm64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Extract version from tag
      id: version
      shell: bash
      run: |
        VERSION=${GITHUB_REF_NAME#v}
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Restore dependencies
      run: dotnet restore

    - name: Publish ${{ matrix.platform }}
      run: |
        dotnet publish src/HueWindows/HueWindows.csproj `
          --configuration Release `
          -p:Platform=${{ matrix.platform }} `
          -p:Version=${{ steps.version.outputs.version }} `
          --output ./publish/${{ matrix.platform }}

    - name: Create zip archive
      shell: pwsh
      run: |
        Compress-Archive -Path ./publish/${{ matrix.platform }}/* -DestinationPath ./HueWindows-${{ steps.version.outputs.version }}-${{ matrix.platform }}.zip

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: HueWindows-${{ matrix.platform }}
        path: ./HueWindows-${{ steps.version.outputs.version }}-${{ matrix.platform }}.zip
        retention-days: 1

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
    - name: Download x64 artifact
      uses: actions/download-artifact@v4
      with:
        name: HueWindows-x64
        path: ./artifacts

    - name: Download ARM64 artifact
      uses: actions/download-artifact@v4
      with:
        name: HueWindows-ARM64
        path: ./artifacts

    - name: Extract version from tag
      id: version
      run: |
        VERSION=${GITHUB_REF_NAME#v}
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        name: HueWindows v${{ steps.version.outputs.version }}
        draft: false
        prerelease: ${{ contains(github.ref_name, '-') }}
        generate_release_notes: true
        files: |
          ./artifacts/HueWindows-${{ steps.version.outputs.version }}-x64.zip
          ./artifacts/HueWindows-${{ steps.version.outputs.version }}-ARM64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
